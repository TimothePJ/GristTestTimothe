<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Planning + Plan de charge</title>
  <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
  <script src="../shared/service-context-core.js?v=20260810-sync3"></script>
  <script src="../shared/grist-service-context.js?v=20260810-sync3"></script>
  <script>
    window.ProjectMutationSyncConfig = {
      mutationSignals: {
        ChargePlanning_Sync: ["TimeSegment", "ProjectTeam"],
        PlanningProjet_Sync: ["Planning_Projet"],
        Avancement_Sync: ["ProjectTeam"]
      },
      observedSignalColumns: ["ChargePlanning_Sync", "PlanningProjet_Sync", "Avancement_Sync"],
      observedSignalTables: {
        ChargePlanning_Sync: ["Planning_Projet", "TimeSegment", "ProjectTeam"],
        PlanningProjet_Sync: ["Planning_Projet"],
        Avancement_Sync: ["Projets2", "ProjectTeam"]
      },
      directSignalTables: ["Planning_Projet", "TimeSegment", "ProjectTeam"],
      dropdownIds: ["ps-project-select"]
    };
  </script>
  <script src="../shared/project-mutation-sync-relay.js?v=20260810-sync3"></script>
  <script src="https://unpkg.com/vis-timeline/standalone/umd/vis-timeline-graph2d.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/vis-timeline/styles/vis-timeline-graph2d.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="./assets/css/variables.css" />
  <link rel="stylesheet" href="./assets/css/styles.css" />
  <script type="module" src="./assets/js/main.js?v=20260810-sync3"></script>
</head>
<body>
  <header id="ps-toolbar" class="ps-toolbar">
    <div class="ps-project">
      <label for="ps-project-select">Projet :</label>
      <select id="ps-project-select"><option value="">Choisir un projet</option></select>
    </div>
    <div class="ps-nav">
      <button id="ps-prev" type="button" title="Periode precedente">&lt;</button>
      <button id="ps-today" type="button">Aujourd'hui</button>
      <button id="ps-next" type="button" title="Periode suivante">&gt;</button>
    </div>
    <div class="ps-zoom" role="group" aria-label="Zoom">
      <button type="button" data-ps-zoom="week">Semaine</button>
      <button type="button" data-ps-zoom="month" class="is-active">Mois</button>
      <button type="button" data-ps-zoom="year">Annee</button>
    </div>
    <div id="ps-range" class="ps-range" aria-live="polite">-</div>
  </header>

  <section id="ps-empty" class="ps-empty" hidden>
    <p>Selectionne un projet pour afficher les plannings.</p>
  </section>

  <main id="ps-main" class="ps-main" hidden>
    <div class="ps-pane ps-pane--planning">
      <div class="ps-planning-header">
        <label class="ps-aggregate">
          <input id="ps-aggregate-toggle" type="checkbox" />
          <span>Rassembler visuellement le planning</span>
        </label>
        <div id="ps-view-switch" class="ps-view-switch" role="group" aria-label="Vue du premier planning" hidden>
          <button type="button" data-ps-view="planning" class="is-active">Planning</button>
          <button type="button" data-ps-view="chart">Graphique</button>
        </div>
        <div id="ps-chart-granularity" class="ps-chart-granularity" role="group" aria-label="Regrouper le graphique par mois ou par semaine" hidden></div>
        <div id="ps-chart-filter" class="ps-chart-filter" role="group" aria-label="Filtrer les types de document" hidden></div>
      </div>
      <div id="ps-planning" class="ps-planning"></div>
      <div id="ps-chart" class="ps-chart" hidden>
        <div id="ps-chart-legend" class="ps-chart-legend"></div>
        <div class="ps-chart-canvas-wrap"><canvas id="ps-chart-canvas"></canvas></div>
      </div>
    </div>
    <div id="ps-splitter" class="ps-splitter" role="separator" aria-orientation="horizontal"
         aria-label="Redimensionner la hauteur du planning" tabindex="0">
      <span class="ps-splitter-grip" aria-hidden="true"></span>
    </div>
    <div class="ps-pane ps-pane--charge">
      <div id="ps-charge" class="ps-charge"></div>
      <div id="ps-charge-empty" class="ps-charge-empty" hidden>Aucun previsionnel pour ce projet.</div>
    </div>
  </main>

  <div id="ps-edit-segment-modal" class="ps-modal" style="display: none;">
    <div class="ps-modal-content ps-modal-content--segment">
      <div class="ps-modal-header">
        <div>
          <h2>Segment mensuel</h2>
          <p class="ps-segment-edit-context">
            <span id="ps-edit-segment-month-label"></span>
            <span id="ps-edit-segment-worker-label"></span>
          </p>
          <p class="ps-modal-subtitle">Saisissez les jours effectivement travaillés sur ce mois.</p>
        </div>
        <button id="ps-edit-segment-cancel" type="button" class="ps-modal-close-btn">Fermer</button>
      </div>
      <div class="ps-segment-edit-form">
        <section class="ps-segment-edit-section">
          <div class="ps-segment-edit-section-copy">
            <h3>Jours Effectifs :</h3>
          </div>
          <div class="ps-segment-edit-grid ps-segment-edit-grid--effectif">
            <label class="ps-segment-edit-field">
              <span>Jours effectifs travaillés</span>
              <input type="number" id="ps-edit-segment-effectif" min="0.5" step="0.5" placeholder="0">
            </label>
            <div class="ps-segment-edit-metric">
              <span class="ps-segment-edit-metric-label">Jours disponibles dans le mois</span>
              <strong id="ps-edit-segment-calculated-days">--</strong>
            </div>
          </div>
          <!-- Charge TOTALE de la personne sur ce mois, tous projets et tous
               services confondus (cf. assets/js/utils/monthLoad.js). -->
          <div class="ps-segment-edit-load" id="ps-edit-segment-load" hidden>
            <div class="ps-segment-edit-load-head">
              <span class="ps-segment-edit-load-label">Charge du mois — tous projets et tous services</span>
              <strong id="ps-edit-segment-load-days">--</strong>
            </div>
            <div
              class="ps-segment-edit-load-track"
              id="ps-edit-segment-load-track"
              role="progressbar"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="0"
              aria-labelledby="ps-edit-segment-load-days"
            >
              <span class="ps-segment-edit-load-fill" id="ps-edit-segment-load-fill"></span>
            </div>
            <p class="ps-segment-edit-load-message" id="ps-edit-segment-load-message" aria-live="polite"></p>
          </div>
        </section>
        <p id="ps-edit-segment-feedback" class="ps-segment-edit-feedback" hidden></p>
      </div>
      <div class="ps-segment-edit-footer">
        <button id="ps-edit-segment-save" type="button">Enregistrer</button>
      </div>
    </div>
  </div>
</body>
</html>
