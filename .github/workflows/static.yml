# Deploys main at the site root and a test branch under /test/.
# GitHub Pages hosts a single site per repository and every deployment
# replaces it entirely, so each run rebuilds BOTH parts, whichever branch
# triggered it. Keep this file identical on main and on the test branch.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch or the test branch
  # (keep in sync with TEST_BRANCH below)
  push:
    branches: ["main", "feature/SyntheseInterfacePlanning"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Branch published under https://timothepj.github.io/GristTestTimothe/test/
env:
  TEST_BRANCH: feature/SyntheseInterfacePlanning

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  # Needed to delete leftover artifacts from a previous run attempt
  actions: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (prod)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod
      - name: Checkout test branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TEST_BRANCH }}
          path: test-src
      - name: Assemble site (main at root, test branch under /test/)
        run: |
          mkdir _site
          rsync -a --exclude=.git prod/ _site/
          rsync -a --exclude=.git test-src/ _site/test/
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # A re-run of a failed attempt keeps the previous attempt's "github-pages"
      # artifact, so deploy-pages then finds 2 and aborts. Remove any leftover
      # before uploading a fresh one.
      - name: Remove stale github-pages artifacts from this run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of data.artifacts) {
              if (artifact.name === 'github-pages') {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
