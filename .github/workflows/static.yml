# Deploys main at the site root and each test branch under /<folder>/.
# GitHub Pages hosts a single site per repository and every deployment
# replaces it entirely, so each run rebuilds ALL parts, whichever branch
# triggered it. Keep this file identical on main and on every test branch.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch or a test branch
  # (keep in sync with TEST_SITES below)
  push:
    branches:
      - "main"
      - "feature/SyntheseInterfacePlanning"
      - "feature/LissageStructure"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# One "folder=branch" per line: the branch is published under
# https://timothepj.github.io/GristTestTimothe/<folder>/
# A branch missing on GitHub is skipped with a warning; prod still deploys.
env:
  TEST_SITES: |
    test=feature/SyntheseInterfacePlanning
    TestStructure=feature/LissageStructure

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  # Needed to delete leftover artifacts from a previous run attempt
  actions: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (prod)
        uses: actions/checkout@v4
        with:
          ref: main
          path: prod
      - name: Assemble site (main at root, test branches under /<folder>/)
        shell: bash
        run: |
          mkdir _site
          rsync -a --exclude=.git prod/ _site/
          while read -r line; do
            [[ "$line" =~ ^([^=[:space:]]+)=([^[:space:]]+)$ ]] || continue
            folder="${BASH_REMATCH[1]}"
            branch="${BASH_REMATCH[2]}"
            if git -C prod fetch --quiet --depth 1 origin "refs/heads/$branch"; then
              mkdir -p "_site/$folder"
              git -C prod archive FETCH_HEAD | tar -x -C "_site/$folder"
              echo "Published $branch under /$folder/"
            else
              echo "::warning::Branch $branch not found, /$folder/ not published"
            fi
          done <<< "$TEST_SITES"
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # A re-run of a failed attempt keeps the previous attempt's "github-pages"
      # artifact, so deploy-pages then finds 2 and aborts. Remove any leftover
      # before uploading a fresh one.
      - name: Remove stale github-pages artifacts from this run
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of data.artifacts) {
              if (artifact.name === 'github-pages') {
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
